name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  kernels:
    # Compiles ascend/engine/kernels.cu for GPUs with NVRTC. No GPU is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]" cupy-cuda12x nvidia-cuda-nvrtc-cu12
      - run: pytest -q tests/test_engine.py -k nvrtc -rs
