[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend"
version = "0.0.1"
description = "Connectome-constrained model of the whole adult fly brain: real-time simulation, effectome mapping, evolved learning rules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "brian2>=2.5.1",
    "cython>=3.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ascend*"]

[tool.setuptools.package-data]
"ascend.reference" = ["LICENSE.shiu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
